<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Access - Community Resource Finder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/admin.css?v=2026-04-01b" />
</head>
<body>
    <div id="auth-action-screen" class="screen">
        <h1 id="auth-action-title">Reset Password</h1>
        <p id="auth-action-message" class="auth-action-message">Checking your reset link...</p>

        <div id="auth-action-form" class="hidden">
            <input id="new-password" type="password" placeholder="New password" autocomplete="new-password" />
            <input id="confirm-password" type="password" placeholder="Confirm new password" autocomplete="new-password" />
            <button id="resetPasswordBtn" type="button">Save New Password</button>
        </div>

        <div id="auth-action-error" class="login-message" aria-live="polite"></div>
        <p class="auth-action-footer">
            <a id="auth-login-link" href="login.html">Back to login</a>
        </p>
    </div>

    <script type="module" src="assets/js/auth-action.js?v=2026-04-01b"></script>
</body>
</html>
