<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login - Community Resource Finder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
</head>
<body>
    <div id="login-screen" class="screen">
        <h1>Community Resource Finder Login</h1>
        <input id="email" type="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />
        <button id="loginBtn" type="button">Log In</button>
        <div id="login-error"></div>
        <p style="margin-top:12px; color:#475569; font-size:14px;">
            Library admins will be routed to the admin portal. Organization users will be routed to the organization portal.
        </p>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
