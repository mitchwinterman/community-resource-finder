<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Resource Finder</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="wrapper">

        <h1>Community Resource Finder</h1>
        <div class="subtitle">
            Browse, search, and filter Resources from the Washoe County Library's Community Resources Guide
        </div>

        <div class="top-links">
            <a href="admin.html" class="admin-link">Admin</a>
        </div>

        <!-- SEARCH + FILTERS -->
        <div class="search-row">

            <!-- Search box -->
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchBox" 
                    placeholder="Search by name, service, keyword, or location..."
                >
            </div>

            <!-- Category dropdown -->
            <div>
                <select id="categorySelect">
                    <option value="all">All categories</option>
                </select>
            </div>

            <!-- Subcategory dropdown -->
            <div>
                <select id="subcategorySelect" disabled>
                    <option value="all">All subcategories</option>
                </select>
            </div>

            <!-- RESET BUTTON -->
            <div>
                <button id="resetButton" class="reset-btn">Reset</button>
            </div>

        </div>

        <!-- SPLIT VIEW: RESULTS + DETAILS -->
        <div class="content-split">

            <!-- Results list -->
            <div id="results" class="results-panel">
                Loading…
            </div>

            <!-- Details panel -->
            <div id="details" class="details-panel">
                <div style="text-align:center; color:#666;">
                    Select a resource<br>
                    <small>Use the search bar or filters above to find a resource, then click to view full details.</small>
                </div>
            </div>

        </div>

    </div>

    <!-- Firebase init (CDN, module) -->
    <script type="module">
        // Import Firebase SDKs from CDN (v12.6.0 as in your snippet)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAGd-wAWcMG2mrzwPBLgvOrmPWmwY7isok",
            authDomain: "washoe-community-resources.firebaseapp.com",
            projectId: "washoe-community-resources",
            storageBucket: "washoe-community-resources.firebasestorage.app",
            messagingSenderId: "788386726804",
            appId: "1:788386726804:web:d069f55e96a5d196b38581",
            measurementId: "G-8BC3DJ5RWH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Expose to non-module scripts (like app.js)
        window.firebaseApp = app;
        window.firebaseDb = db;
        window.firebaseAuth = auth;
    </script>

    <!-- Your existing app logic (still a classic script) -->
    <script src="app.js"></script>
</body>
</html>
