<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Resource Finder</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="wrapper">

        <!-- HEADER -->
        <header class="app-header">
            <!-- WCLS logo top-left -->
            <a href="https://www.washoecountylibrary.us/index.php"
               class="wcls-link"
               target="_blank"
               rel="noopener noreferrer">
                <img src="wcls-logo.png"
                     alt="Washoe County Library System"
                     class="logo-wcls" />
            </a>

            <!-- Centered CRF brand block -->
            <div id="brand-home" class="brand-home">
                <img src="crf-logo.png"
                     alt="Community Resource Finder"
                     class="logo-crf" />
                <div class="brand-text">
                    <h1 id="app-title" class="app-title">Community Resource Finder</h1>
                    <div class="subtitle">
                        Browse, search, and filter resources from the Washoe County Library’s Community Resources Guide
                    </div>
                </div>
            </div>

            <!-- Right side just spacer for centering -->
            <div class="header-spacer"></div>
        </header>

        <!-- SEARCH + FILTERS -->
        <div class="search-row">

            <!-- Search box -->
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchBox" 
                    placeholder="Search by name, service, keyword, or location..."
                >
            </div>

            <!-- Category dropdown -->
            <div>
                <select id="categorySelect">
                    <option value="all">All categories</option>
                </select>
            </div>

            <!-- Subcategory dropdown -->
            <div>
                <select id="subcategorySelect" disabled>
                    <option value="all">All subcategories</option>
                </select>
            </div>

            <!-- RESET BUTTON -->
            <div>
                <button id="resetButton" class="reset-btn">Reset</button>
            </div>

        </div>

        <!-- SPLIT VIEW: RESULTS + DETAILS -->
        <div class="content-split">

            <!-- Results list -->
            <div class="results-panel">
                <div id="resultCount" class="result-count"></div>
                <div id="results">
                    Loading…
                </div>
            </div>

            <!-- Details panel -->
            <div id="details" class="details-panel">
                <div class="details-empty">
                    Select a resource<br />
                    <small>Use the search bar or filters above to find a resource, then click to view full details.</small>
                </div>
            </div>

        </div>

        <!-- FOOTER -->
        <footer class="app-footer">
            <div class="footer-left">
                © 2025 Washoe County Library System
            </div>
            <div class="footer-right">
                <a href="https://www.washoecountylibrary.us/index.php"
                   target="_blank"
                   rel="noopener noreferrer">Library website</a>
                <span class="footer-separator">•</span>
                <a href="admin.html" class="footer-admin-link">Admin</a>
            </div>
        </footer>

    </div>

    <!-- Frontend app (module) -->
    <script type="module" src="app.js"></script>
</body>
</html>
