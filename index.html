<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Resource Finder</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="wrapper">

        <!-- BRANDED HEADER -->
        <header class="app-header">
            <div class="app-brand-left">
                <img src="crf-logo.png" alt="Community Resource Finder logo" class="logo-crf" />

                <div class="app-title-block">
                    <h1 id="app-title" class="app-title">Community Resource Finder</h1>
                    <div class="subtitle">
                        Browse, search, and filter resources from the Washoe County Library’s Community Resources Guide
                    </div>
                </div>
            </div>

            <div class="app-brand-right">
                <div class="app-meta">
                    <span class="powered-by-label">A project of</span>
                    <img src="wcls-logo.png" alt="Washoe County Library System logo" class="logo-wcls" />
                </div>
                <a href="admin.html" class="admin-link">Admin</a>
            </div>
        </header>

        <!-- SEARCH + FILTERS -->
        <div class="search-row">

            <!-- Search box -->
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchBox" 
                    placeholder="Search by name, service, keyword, or location..."
                >
            </div>

            <!-- Category dropdown -->
            <div>
                <select id="categorySelect">
                    <option value="all">All categories</option>
                </select>
            </div>

            <!-- Subcategory dropdown -->
            <div>
                <select id="subcategorySelect" disabled>
                    <option value="all">All subcategories</option>
                </select>
            </div>

            <!-- RESET BUTTON -->
            <div>
                <button id="resetButton" class="reset-btn">Reset</button>
            </div>

        </div>

        <!-- SPLIT VIEW: RESULTS + DETAILS -->
        <div class="content-split">

            <!-- Results list -->
            <div class="results-panel">
                <div id="resultCount" class="result-count"></div>
                <div id="results">
                    Loading…
                </div>
            </div>

            <!-- Details panel -->
            <div id="details" class="details-panel">
                <div class="details-empty">
                    Select a resource<br>
                    <small>Use the search bar or filters above to find a resource, then click to view full details.</small>
                </div>
            </div>

        </div>

    </div>

    <!-- Frontend app (module) -->
    <script type="module" src="app.js"></script>
</body>
</html>
