<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Resource Finder</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="wrapper">

        <h1>Community Resource Finder</h1>
        <div class="subtitle">
            Browse, search, and filter resources from the Downtown Reno Library community list.
        </div>

        <!-- SEARCH + FILTERS -->
        <div class="search-row">

            <!-- Search box -->
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchBox" 
                    placeholder="Search by name, service, keyword, or location..."
                >
            </div>

            <!-- Category dropdown -->
            <div>
                <select id="categorySelect">
                    <option value="all">All categories</option>
                </select>
            </div>

            <!-- Subcategory dropdown -->
            <div>
                <select id="subcategorySelect">
                    <option value="all">All subcategories</option>
                </select>
            </div>

        </div>

        <!-- Results list -->
<div id="results"
    <script src="app.js"></script>
</body>
</html>
