<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin Panel — Community Resource Finder</title>
    <link rel="stylesheet" href="admin.css" />
</head>

<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="screen">
        <h1>Admin Login</h1>
        <input id="email" type="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />
        <button id="loginBtn">Log In</button>
        <div id="login-error"></div>
    </div>

    <!-- ADMIN SCREEN -->
    <div id="admin-screen" class="screen hidden">

        <!-- TOP BAR -->
        <div class="topbar">
            <div class="topbar-left">
                <a href="index.html" class="topbar-brand">
                    <img src="crf-logo.png" alt="Community Resource Finder logo" class="logo-crf-small" />
                    <div class="topbar-text">
                        <span class="topbar-title">Community Resource Finder</span>
                        <span class="topbar-subtitle">Admin Panel</span>
                    </div>
                </a>
            </div>

            <div class="topbar-right">
                <div class="topbar-meta">
                    <span class="powered-by-label">A project of</span>
                    <img src="wcls-logo.png" alt="Washoe County Library System logo" class="logo-wcls-small" />
                </div>
                <button id="logoutBtn">Log Out</button>
            </div>
        </div>

        <!-- NAV -->
        <div class="nav">
            <button class="nav-btn" data-panel="resources">Edit Resources</button>
            <button class="nav-btn" data-panel="categories">Edit Categories</button>
        </div>

        <!-- RESOURCES PANEL -->
        <div id="panel-resources" class="panel hidden">

            <div class="panel-header">
                <h3>Resources</h3>
                <button id="add-resource-btn">+ Add New Resource</button>
            </div>

            <div class="admin-split">
                <div class="admin-list" id="resource-list"></div>

                <div class="admin-editor">
                    <div id="resource-editor" class="editor hidden">
                        <h3 id="editor-title">Edit Resource</h3>
                        <div id="resource-form"></div>

                        <div class="editor-actions">
                            <button id="save-resource-btn">Save</button>
                            <button id="delete-resource-btn">Delete</button>
                            <button id="cancel-resource-btn">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- CATEGORIES PANEL -->
        <div id="panel-categories" class="panel hidden">

            <div class="panel-header">
                <h3>Categories</h3>
                <button id="add-category-btn">+ Add Category</button>
            </div>

            <div class="admin-split">
                <div class="admin-list" id="category-list"></div>

                <div class="admin-editor">
                    <div id="category-editor" class="editor hidden">
                        <h3 id="category-editor-title">Edit Category</h3>

                        <div class="field-group">
                            <label class="field-label" for="category-name-input">Category Name</label>
                            <input id="category-name-input" placeholder="Category Name" />
                        </div>

                        <h4>Subcategories</h4>
                        <div id="subcategory-list"></div>
                        <button id="add-sub-btn">+ Add Subcategory</button>

                        <div class="editor-actions">
                            <button id="save-category-btn">Save Category</button>
                            <button id="delete-category-btn">Delete Category</button>
                            <button id="cancel-category-btn">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
